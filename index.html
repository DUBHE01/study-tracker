<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>每日学习打卡</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f6f4ef;            /* 暖纸色，护眼 */
  --card: #ffffff;
  --text: #2b2a27;
  --sub: #8a857b;
  --border: #e8e4dc;
  --green: #059669;         /* 主操作绿 */
  --green-dark: #047857;
  --blue: #2563eb;
  --purple: #7c3aed;
  --shadow: 0 2px 14px rgba(60,50,30,.06);
  --radius: 20px;
  --font: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font); background: var(--bg); color: var(--text);
  min-height: 100dvh; padding: 0 0 env(safe-area-inset-bottom); -webkit-tap-highlight-color: transparent;
  font-size: 16px; line-height: 1.6;
}
.container { max-width: 520px; margin: 0 auto; padding: 16px 16px 32px; }

/* 头部 */
.header { text-align: center; padding: 22px 0 12px; }
.header h1 { font-size: 24px; font-weight: 800; letter-spacing: .02em; display: flex; align-items: center; justify-content: center; gap: 8px; }
.header .ic { width: 26px; height: 26px; color: var(--green); }
.date-badge { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; padding: 6px 16px; background: var(--card); border-radius: 999px; font-size: 14px; color: var(--sub); box-shadow: var(--shadow); }
.date-badge .ic { width: 14px; height: 14px; }

/* 同步状态条 */
.sync-bar { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12.5px; color: var(--sub); padding: 8px 14px; margin: 10px auto 0; width: fit-content; background: var(--card); border-radius: 999px; box-shadow: var(--shadow); }
.sync-bar .dot { width: 8px; height: 8px; border-radius: 50%; background: #d1cfc9; flex-shrink: 0; }
.sync-bar.ok .dot { background: var(--green); }
.sync-bar.err .dot { background: #e11d48; }
.sync-bar.busy .dot { background: var(--blue); animation: pulse 1s ease infinite; }
.sync-bar.warn .dot { background: #f59e0b; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

/* 卡片 */
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; margin-bottom: 16px; border: 1px solid rgba(232,228,220,.6); }

/* 达标横幅 */
.banner { border-radius: var(--radius); padding: 20px; margin-bottom: 16px; text-align: center; animation: pop .35s ease; box-shadow: var(--shadow); border: 1px solid transparent; }
@keyframes pop { 0%{transform:scale(.95);opacity:0} 100%{transform:scale(1);opacity:1} }
.banner .b-icon { display: flex; align-items: center; justify-content: center; margin-bottom: 6px; }
.banner .b-icon .ic { width: 40px; height: 40px; }
.banner .b-title { font-size: 19px; font-weight: 800; }
.banner .b-sub { font-size: 13px; margin-top: 4px; opacity: .9; }
.banner.gray { background: #f0eee9; border-color: #e2ded5; color: #6f6a61; }
.banner.yellow { background: linear-gradient(135deg,#fef3c7,#fde68a); border-color: #fcd34d; color: #92400e; }
.banner.green { background: linear-gradient(135deg,#d1fae5,#a7f3d0); border-color: #6ee7b7; color: #065f46; }
.banner.gold { background: linear-gradient(135deg,#fef9c3,#fcd34d); border-color: #facc15; color: #854d0e; }

/* 任务分区 */
.section-title { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; margin-bottom: 6px; padding-bottom: 10px; border-bottom: 2px solid var(--border); color: var(--sub); letter-spacing: .04em; }
.section-title .ic { width: 16px; height: 16px; }
.section-title.morning { border-color: #fde68a; }
.section-title.afternoon { border-color: #bfdbfe; }
.section-title.evening { border-color: #ddd6fe; }
.task-row { padding: 12px 0; transition: all .2s; }
.task-row + .task-row { border-top: 1px solid var(--border); }
.task-line { display: flex; align-items: flex-start; gap: 14px; cursor: pointer; min-height: 44px; }
.checkbox-wrap { position: relative; flex-shrink: 0; margin-top: 1px; width: 30px; height: 30px; display: block; }
.checkbox-wrap input { position: absolute; opacity: 0; width: 0; height: 0; }
.checkbox-custom { display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; border: 2.5px solid #d1cfc9; border-radius: 10px; transition: all .2s; cursor: pointer; background: #fff; }
.checkbox-custom svg { width: 16px; height: 16px; color: #fff; opacity: 0; transform: scale(.5); transition: all .18s; }
.checkbox-wrap input:checked + .checkbox-custom { background: var(--green); border-color: var(--green); }
.checkbox-wrap input:checked + .checkbox-custom svg { opacity: 1; transform: scale(1); }
.task-label { flex: 1; font-size: 16px; line-height: 1.5; }
.task-label .tag { display: inline-block; font-size: 11px; padding: 2px 9px; border-radius: 999px; margin-left: 6px; vertical-align: middle; font-weight: 600; }
.tag.fixed { background: #fef3c7; color: #92400e; }
.tag.practice { background: #dbeafe; color: #1e40af; }
.tag.review { background: #ede9fe; color: #6b21a8; }
.task-row.done .task-label .name { color: #b0aca3; text-decoration: line-through; text-decoration-color: #c9c5bc; }
.task-row.done .tag { opacity: .5; }
.task-row.done .checkbox-custom { background: var(--green); border-color: var(--green); }
.note-preview { margin: 10px 0 0 44px; padding: 10px 14px; background: #f4f7f4; border-left: 3px solid var(--green); border-radius: 0 12px 12px 0; font-size: 14px; color: #3d3a35; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
.task-row:not(.done) .note-preview { border-left-color: #fbbf24; background: #fdfaf1; }
.task-row .add-note-hint { margin: 8px 0 0 44px; font-size: 12.5px; color: var(--sub); }

/* 进度 */
.progress-bar-wrap { margin-top: 16px; background: #f0eee9; border-radius: 999px; height: 12px; overflow: hidden; }
.progress-bar { height: 100%; background: linear-gradient(90deg,#10b981,#34d399); border-radius: 999px; transition: width .3s ease; }
.progress-text { text-align: center; font-size: 13.5px; color: var(--sub); margin-top: 8px; }
.progress-text b { color: var(--text); }

/* 按钮 */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 12px 20px; border: none; border-radius: 14px; font-size: 15.5px; font-weight: 700; cursor: pointer; transition: all .18s; font-family: var(--font); text-align: center; }
.btn:active { transform: scale(.97); }
.btn .ic { width: 18px; height: 18px; }
.btn-group { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.btn-group .btn { flex: 1; min-width: 130px; }
.btn-primary { background: var(--green-dark); color: #fff; box-shadow: 0 4px 14px rgba(4,120,87,.28); }
.btn-primary:hover { background: #065f46; }
.btn-blue { background: var(--blue); color: #fff; box-shadow: 0 4px 14px rgba(37,99,235,.25); }
.btn-blue:hover { background: #1d4ed8; }
.btn-outline { background: #fff; color: var(--text); border: 2px solid var(--border); }
.btn-outline:hover { background: #faf9f5; }
.btn-sm { min-height: 40px; padding: 8px 16px; font-size: 13.5px; border-radius: 12px; }

/* AI 反馈 */
.ai-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; margin-bottom: 16px; border-top: 4px solid var(--purple); border: 1px solid rgba(232,228,220,.6); }
.ai-card .ai-title { font-size: 16px; font-weight: 800; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.ai-card .ai-title .ic { width: 20px; height: 20px; color: var(--purple); }
.ai-loading { text-align: center; color: var(--sub); padding: 20px 0; font-size: 14px; }
.ai-loading .spinner { display: inline-block; width: 26px; height: 26px; border: 3px solid var(--border); border-top-color: var(--purple); border-radius: 50%; animation: spin .8s linear infinite; margin-bottom: 8px; }
@keyframes spin { to { transform: rotate(360deg); } }
.ai-hint { text-align: center; color: var(--sub); padding: 12px 0; font-size: 13.5px; line-height: 1.9; }
.ai-sec { margin-bottom: 16px; }
.ai-sec h4 { font-size: 13.5px; font-weight: 800; margin-bottom: 8px; display: flex; align-items: center; gap: 7px; letter-spacing: .02em; }
.ai-sec h4 .ic { width: 16px; height: 16px; }
.ai-sec .body { font-size: 14.5px; line-height: 1.8; color: #3d3a35; white-space: pre-wrap; word-break: break-word; }
.ai-sec.summary h4 { color: #0d9488; }
.ai-sec.summary .body { background: #f0fdfa; border-radius: 12px; padding: 12px 14px; }
.ai-sec.correct h4 { color: #e11d48; }
.ai-sec.correct .body { background: #fff1f2; border-radius: 12px; padding: 12px 14px; }
.ai-sec.correct .body ul { list-style: none; }
.ai-sec.correct .body li { margin: 4px 0 4px 20px; position: relative; }
.ai-sec.correct .body li::before { content: ''; position: absolute; left: -14px; top: 11px; width: 6px; height: 6px; border-radius: 50%; background: #fda4af; }
.ai-sec.insight h4 { color: var(--purple); }
.ai-sec.insight .body { background: #f5f3ff; border-radius: 12px; padding: 12px 14px; }
.ai-sec.questions h4 { color: var(--blue); }
.q-item { margin-bottom: 8px; padding: 12px 14px; background: #eff6ff; border-radius: 12px; font-size: 14.5px; line-height: 1.7; }
.q-item b { display: block; margin-bottom: 2px; color: #1d4ed8; font-size: 13px; }
.ai-sec.answers h4 { color: #059669; margin-top: 4px; }
details.a-box { background: #f0fdf4; border-radius: 12px; margin-bottom: 8px; padding: 12px 14px; font-size: 14.5px; }
details.a-box summary { cursor: pointer; font-weight: 700; color: #047857; display: flex; align-items: center; gap: 6px; min-height: 30px; }
details.a-box summary::before { content: ''; width: 0; height: 0; border-left: 5px solid currentColor; border-top: 4px solid transparent; border-bottom: 4px solid transparent; transition: transform .18s; }
details.a-box[open] summary::before { transform: rotate(90deg); }
details.a-box .a-body { margin-top: 8px; line-height: 1.8; white-space: pre-wrap; color: #3d3a35; }
.ai-time { text-align: right; font-size: 11px; color: #d0ccc3; margin-top: 4px; }

/* 追问区 */
.followup-wrap { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--border); }
.followup-q { background: #eff6ff; border-radius: 12px 12px 4px 12px; padding: 10px 14px; font-size: 14px; color: #1d4ed8; margin-bottom: 8px; word-break: break-word; display: flex; gap: 8px; align-items: flex-start; }
.followup-q .ic { width: 15px; height: 15px; color: var(--blue); flex-shrink: 0; margin-top: 2px; }
.followup-a { background: #f5f3ff; border-radius: 4px 12px 12px 12px; padding: 10px 14px; font-size: 14px; color: #3d3a35; margin-bottom: 12px; word-break: break-word; line-height: 1.75; display: flex; gap: 8px; align-items: flex-start; }
.followup-a .ic { width: 15px; height: 15px; color: var(--purple); flex-shrink: 0; margin-top: 2px; }
.followup-input { display: flex; gap: 8px; align-items: stretch; }
.followup-input input { flex: 1; padding: 11px 14px; border: 2px solid var(--border); border-radius: 12px; font-size: 14px; font-family: var(--font); background: #fff; }
.followup-input input:focus { outline: none; border-color: var(--purple); }
.followup-input input:disabled { background: #f5f4f0; color: var(--sub); }
.followup-input .btn { min-height: 44px; padding: 0 18px; font-size: 14px; flex-shrink: 0; }
.followup-loading { text-align: center; color: var(--sub); font-size: 13px; padding: 8px 0; }

/* 底部弹窗（Bottom Sheet） */
.sheet-mask { position: fixed; inset: 0; background: rgba(30,28,24,.42); display: flex; align-items: flex-end; justify-content: center; z-index: 200; animation: fadein .2s ease; }
@keyframes fadein { from { opacity: 0 } to { opacity: 1 } }
.sheet { background: #fff; border-radius: 24px 24px 0 0; width: 100%; max-width: 520px; padding: 12px 20px calc(24px + env(safe-area-inset-bottom)); animation: sheetup .28s cubic-bezier(.2,.8,.25,1); max-height: 82dvh; overflow-y: auto; }
@keyframes sheetup { from { transform: translateY(60px); opacity: .4 } to { transform: translateY(0); opacity: 1 } }
.sheet-handle { width: 40px; height: 4px; border-radius: 999px; background: #e5e1d9; margin: 2px auto 14px; }
.sheet-title { font-size: 17px; font-weight: 800; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.sheet-title .ic { width: 20px; height: 20px; color: var(--green); }
.sheet textarea { width: 100%; padding: 14px; border: 2px solid var(--border); border-radius: 14px; font-size: 16px; font-family: var(--font); min-height: 110px; resize: vertical; line-height: 1.7; background: #fdfcfa; }
.sheet textarea:focus { outline: none; border-color: var(--green); background: #fff; }
.sheet-hint { font-size: 12.5px; color: var(--sub); margin: 10px 2px 16px; }
.sheet .btn-save { width: 100%; background: var(--green-dark); color: #fff; box-shadow: 0 4px 14px rgba(4,120,87,.28); }
.sheet .btn-save:hover { background: #065f46; }
.sheet .btn-save:disabled { opacity: .6; }
.sheet .btn-cancel { width: 100%; margin-top: 10px; background: #f4f2ed; color: var(--sub); min-height: 46px; font-weight: 600; }
.sheet .btn-cancel:hover { background: #ece9e2; }

/* 管理页 */
.stat-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; margin-bottom: 16px; border: 1px solid rgba(232,228,220,.6); }
.stat-card h3 { font-size: 15px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.stat-card h3 .ic { width: 17px; height: 17px; color: var(--blue); }
.day-grid { display: flex; gap: 8px; justify-content: flex-start; margin-bottom: 12px; flex-wrap: wrap; }
.day-cell { width: 44px; border-radius: 12px; text-align: center; padding: 8px 4px 6px; }
.day-cell .dn { font-size: 17px; font-weight: 800; }
.day-cell .dd { font-size: 8px; margin-top: 1px; opacity: .75; }
.day-cell .dc { font-size: 10px; margin-top: 2px; font-weight: 600; }
.s-color-0 { background: #f0eee9; color: #a09a8f; }
.s-color-1 { background: #fecaca; color: #991b1b; }
.s-color-2 { background: #86efac; color: #14532d; }
.s-color-3 { background: #4ade80; color: #14532d; }
.s-color-4 { background: #22c55e; color: #fff; }
.s-color-5 { background: #16a34a; color: #fff; }
.s-color-6 { background: #15803d; color: #fff; }
.selector-row { display: flex; gap: 12px; margin-bottom: 14px; align-items: center; }
.selector-row label { font-size: 14px; font-weight: 600; min-width: 40px; }
.selector-row input, .selector-row select { flex: 1; padding: 12px 14px; border: 2px solid var(--border); border-radius: 12px; font-size: 15px; font-family: var(--font); background: #fff; }
.admin-note { font-size: 12.5px; color: var(--sub); line-height: 1.9; margin-top: 6px; }
.cloud-row { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; background: #f8f7f3; margin-bottom: 12px; font-size: 13.5px; }
.cloud-row .dot { width: 10px; height: 10px; border-radius: 50%; background: #d1cfc9; flex-shrink: 0; }
.cloud-row.ok .dot { background: var(--green); }
.cloud-row.err .dot { background: #e11d48; }
.cloud-row.busy .dot { background: var(--blue); animation: pulse 1s ease infinite; }
.cloud-row .cloud-status { flex: 1; }
.cloud-row .cloud-sub { font-size: 11.5px; color: var(--sub); display: block; }

.toast { position: fixed; bottom: calc(30px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); background: #2a2824; color: #fff; padding: 12px 22px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 300; white-space: nowrap; max-width: 92vw; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
.toast.show { opacity: 1; }
.loading { text-align: center; padding: 40px; color: var(--sub); }
.spinner { display: inline-block; width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--green); border-radius: 50%; animation: spin .8s linear infinite; }

/* ============ 全局 SVG 图标默认尺寸（修复巨大图标 bug）============ */
.ic { width: 18px; height: 18px; flex-shrink: 0; vertical-align: middle; }
.header h1 .ic { width: 26px; height: 26px; }
.date-badge .ic { width: 14px; height: 14px; }
.stat-card h3 .ic { width: 18px; height: 18px; }
.ai-card .ai-title .ic { width: 20px; height: 20px; }
.ai-sec h4 .ic { width: 16px; height: 16px; }
.checkbox-custom .ic { width: 16px; height: 16px; color: #fff; }

/* ============ 电脑端布局重构（>=768px）============ */
@media (min-width: 768px) {
  .container { max-width: 1280px; padding: 24px 32px 40px; }
  .header { padding: 14px 0 16px; }
  .admin-grid { display: grid; grid-template-columns: 380px 1fr; gap: 22px; align-items: start; }
}
.admin-grid { margin-bottom: 18px; }
.admin-full { margin-bottom: 18px; }

/* ============ 顶部 KPI 摘要 ============ */
.admin-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
@media (max-width: 767px) { .admin-kpis { grid-template-columns: repeat(2, 1fr); } }
.kpi-card { background: var(--card); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); border: 1px solid rgba(232,228,220,.6); display: flex; align-items: center; gap: 12px; }
.kpi-icon { width: 38px; height: 38px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.kpi-icon .ic { width: 20px; height: 20px; }
.kpi-icon.green { background: linear-gradient(135deg,#d1fae5,#a7f3d0); color: #047857; }
.kpi-icon.amber { background: linear-gradient(135deg,#fef3c7,#fde68a); color: #b45309; }
.kpi-icon.purple { background: linear-gradient(135deg,#ede9fe,#ddd6fe); color: #6d28d9; }
.kpi-icon.blue { background: linear-gradient(135deg,#dbeafe,#bfdbfe); color: #1d4ed8; }
.kpi-info { flex: 1; min-width: 0; }
.kpi-value { font-size: 18px; font-weight: 800; line-height: 1.2; }
.kpi-label { font-size: 12px; color: var(--sub); margin-top: 3px; }

/* ============ 今日打卡卡片 ============ */
.today-card { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); padding: 20px; border: 1px solid rgba(232,228,220,.6); }
.today-card .head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
.today-card .head-row h3 { font-size: 15px; font-weight: 800; }

/* ============ 审核面板 v2 ============ */
.review-panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
.review-panel-title { font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
.review-panel-title .ic { width: 20px; height: 20px; color: var(--green); }
.review-toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.review-toolbar .filter-pill { padding: 6px 14px; border-radius: 999px; font-size: 12.5px; font-weight: 600; cursor: pointer; border: 1.5px solid var(--border); background: #fff; color: var(--sub); transition: all .15s; }
.review-toolbar .filter-pill.active { background: var(--green-dark); color: #fff; border-color: var(--green-dark); }
.review-toolbar .filter-pill:not(.active):hover { border-color: var(--green); color: var(--text); }
.review-toolbar .count { font-size: 12.5px; color: var(--sub); margin-left: 4px; font-weight: 600; }

.review-day-card { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); padding: 18px; margin-bottom: 12px; border: 1px solid rgba(232,228,220,.6); }
.review-day-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px dashed var(--border); flex-wrap: wrap; }
.review-day-date { font-size: 15.5px; font-weight: 800; display: flex; align-items: center; gap: 6px; color: var(--text); }
.review-day-date .ic { width: 16px; height: 16px; color: var(--green); }
.review-day-week { font-size: 12.5px; color: var(--sub); }
.review-day-progress { margin-left: auto; padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; background: #f0eee9; color: var(--sub); display: inline-flex; align-items: center; gap: 5px; }
.review-day-progress.pass { background: linear-gradient(135deg,#d1fae5,#a7f3d0); color: #065f46; }
.review-day-progress .ic { width: 13px; height: 13px; }
.review-day-status { width: 10px; height: 10px; border-radius: 50%; background: #d1d5db; flex-shrink: 0; }
.review-day-status.reviewed { background: var(--green); box-shadow: 0 0 0 3px rgba(16,185,129,.18); }
.review-day-status.partial { background: #f59e0b; box-shadow: 0 0 0 3px rgba(245,158,11,.18); }

.review-task-row { display: flex; align-items: flex-start; gap: 12px; padding: 10px 0; }
.review-task-row + .review-task-row { border-top: 1px solid var(--border); }
.review-task-info { flex: 1; min-width: 0; }
.review-task-name { font-size: 14.5px; font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--text); }
.review-task-name .tag { font-size: 10.5px; padding: 2px 7px; }

/* ================= 工具 ================= */
function pad(n) { return n < 10 ? '0' + n : '' + n; }
function todayStr() { var d = new Date(); return '' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()); }
function fmtDate(s) { return parseInt(s.slice(4, 6), 10) + '月' + parseInt(s.slice(6, 8), 10) + '日'; }
function fmtWeekday(s) {
  var dt = new Date(parseInt(s.slice(0, 4), 10), parseInt(s.slice(4, 6), 10) - 1, parseInt(s.slice(6, 8), 10));
  return '日一二三四五六'[dt.getDay()];
}
function defaultMode(dateStr) {
  var y = parseInt(dateStr.slice(0, 4), 10), m = parseInt(dateStr.slice(4, 6), 10) - 1, d = parseInt(dateStr.slice(6, 8), 10);
  var dt = new Date(y, m, d), start = new Date(y, 0, 0);
  return MODE_CYCLE[Math.floor((dt - start) / 86400000) % 3];
}
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function showToast(msg) {
  var t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._tid); t._tid = setTimeout(function () { t.classList.remove('show'); }, 2400);
}
function getStore(name) {
  try { return localStorage.getItem(name); } catch (e) { return null; }
}
function setStore(name, val) {
  try { localStorage.setItem(name, val); return true; } catch (e) { return false; }
}

/* ================= 本地存储 ================= */
var all = {};
var lsWriteFailed = false;

function normalizeDay(day) {
  /* 防御：修复旧格式/损坏数据，保证关键字段存在 */
  if (!day || typeof day !== 'object') day = {};
  if (!Array.isArray(day.tasks)) day.tasks = [];
  day.tasks = day.tasks.map(function (t) {
    return {
      task_index: typeof t.task_index === 'number' ? t.task_index : -1,
      label: t.label || '',
      name: t.name || '',
      section: t.section || 'morning',
      tag: t.tag || '',
      tagClass: t.tagClass || 'fixed',
      completed: !!t.completed,
      note: typeof t.note === 'string' ? t.note : ''
    };
  });
  if (typeof day.mode !== 'string' || !MODES[day.mode]) day.mode = 'A';
  day.pushed = day.pushed && typeof day.pushed === 'object' ? day.pushed : {};
  if (typeof day.pushed.notes !== 'object' || !day.pushed.notes) day.pushed.notes = {};
  if (typeof day.pushed.analysis !== 'boolean') day.pushed.analysis = false;
  if (!day.analysis || typeof day.analysis !== 'object') day.analysis = null;
  /* 补全缺失科目（按 task_index），保证 6 科齐全、顺序固定 */
  if (day.tasks.length === 0) {
    day.tasks = makeTasksForMode(day.mode).map(function (t) {
      return { task_index: t.task_index, label: t.label, name: t.name, section: t.section, tag: t.tag, tagClass: t.tagClass, completed: false, note: '' };
    });
  } else {
    var byIdx = {};
    day.tasks.forEach(function (t) { if (typeof t.task_index === 'number') byIdx[t.task_index] = t; });
    day.tasks = makeTasksForMode(day.mode).map(function (f, i) {
      return byIdx[i] || { task_index: i, label: f.label, name: f.name, section: f.section, tag: f.tag, tagClass: f.tagClass, completed: false, note: '' };
    });
  }
  /* 旧格式 pushed.notes[i]=true → 转为笔记内容（内容一致则不再重复推送） */
  Object.keys(day.pushed.notes).forEach(function (i) {
    if (day.pushed.notes[i] === true && day.tasks[i] && day.tasks[i].note) day.pushed.notes[i] = day.tasks[i].note;
  });
  if (typeof day.dirty !== 'boolean') day.dirty = false;
  if (typeof day.updatedAt !== 'number') day.updatedAt = 0;
  if (!day.review || typeof day.review !== 'object') day.review = {};
  return day;
}

function loadAll() {
  var raw = getStore(LS_KEY);
  if (raw) {
    try { all = JSON.parse(raw) || {}; } catch (e) { all = {}; }
  } else {
    /* v3 → v4 迁移：旧数据必须保留（手机上的打卡记录） */
    var legacy = getStore(LEGACY_KEY);
    if (legacy) {
      try {
        var old = JSON.parse(legacy) || {};
        Object.keys(old).forEach(function (k) { all[k] = normalizeDay(old[k]); });
        setStore(LS_KEY, JSON.stringify(all));
        try { localStorage.removeItem(LEGACY_KEY); } catch (e2) {}
      } catch (e) { all = {}; }
    }
  }
  Object.keys(all).forEach(function (k) { all[k] = normalizeDay(all[k]); });
}

function lsSave() {
  try {
    var keys = Object.keys(all);
    if (keys.length > MAX_DAYS_KEEP) {
      keys.sort().slice(0, keys.length - MAX_DAYS_KEEP).forEach(function (k) { delete all[k]; });
    }
    var ok = setStore(LS_KEY, JSON.stringify(all));
    if (!ok && !lsWriteFailed) {
      lsWriteFailed = true;
      showToast('⚠️ 本设备存储不可用，打卡记录无法长期保存');
    }
  } catch (e) { console.warn('保存失败', e); }
}

function dayGet(date) {
  if (!all[date]) {
    var mode = defaultMode(date);
    all[date] = {
      mode: mode,
      tasks: makeTasksForMode(mode).map(function (t) { return { task_index: t.task_index, label: t.label, name: t.name, section: t.section, tag: t.tag, tagClass: t.tagClass, completed: false, note: '' }; }),
      analysis: null, aiError: null, analyzing: false, pendingAnalyze: false,
      pushed: { notes: {}, analysis: false },
      dirty: false, updatedAt: 0
    };
  }
  return normalizeDay(all[date]);
}
function completedCount(date) { return dayGet(date).tasks.filter(function (t) { return t.completed; }).length; }

/* ================= 云端同步（Supabase REST，零外部依赖） ================= */
var cloudReady = false;
var cloudStatus = 'off';   // off | ok | err | busy
var cloudLastSync = '';

function getCloudCfg() {
  var url = getStore(CFG_URL_KEY) || SUPABASE_URL;
  var key = getStore(CFG_KEY_KEY) || SUPABASE_KEY;
  /* 容错：用户可能误把 /rest/v1/ 之类后缀也粘进去了，自动剥掉，只留根域名 */
  var cleanUrl = (url || '').trim().replace(/\/rest\/.+$/, '').replace(/\/+$/, '');
  return { url: cleanUrl, key: key && key.trim() };
}

function sbFetch(path, opts) {
  /* 直接调用 Supabase PostgREST，不走任何外部 SDK/CDN */
  var cfg = getCloudCfg();
  opts = opts || {};
  var headers = {
    'apikey': cfg.key,
    'Authorization': 'Bearer ' + cfg.key
  };
  if (opts.body !== undefined) headers['Content-Type'] = 'application/json';
  if (opts.prefer) headers['Prefer'] = opts.prefer;
  return fetch(cfg.url.replace(/\/+$/, '') + '/rest/v1/' + SUPABASE_TABLE + path, {
    method: opts.method || 'GET',
    headers: headers,
    body: opts.body !== undefined ? opts.body : undefined
  }).then(function (res) {
    if (!res.ok) {
      return res.text().then(function (t) { throw new Error('HTTP ' + res.status + (t ? ' ' + t.slice(0, 120) : '')); });
    }
    if (res.status === 204) return null;
    return res.json().catch(function () { return null; });
  });
}

/* 云端数据只存持久化部分（不含 dirty/updatedAt 运行态） */
function toCloudData(day) {
  return {
    mode: day.mode,
    tasks: day.tasks,
    analysis: day.analysis,
    aiError: day.aiError || null,
    pushed: day.pushed,
    review: day.review || {}
  };
}

function fromCloudRow(row) {
  var day = normalizeDay(row && row.data);
  day.dirty = false;
  var ts = row && row.updated_at ? Date.parse(row.updated_at) : 0;
  day.updatedAt = isNaN(ts) ? 0 : ts;
  return day;
}

function syncPullAll() {
  if (!cloudReady) { setCloudStatus('off'); return Promise.resolve(); }
  setCloudStatus('busy');
  return sbFetch('?select=date,data,updated_at')
    .then(function (rows) {
      var changed = false;
      (rows || []).forEach(function (row) {
        var date = row.date;
        if (!date || typeof date !== 'string') return;
        var local = all[date];
        var rts = row.updated_at ? Date.parse(row.updated_at) : 0;
        if (isNaN(rts)) rts = 0;
        if (!local || rts > (local.updatedAt || 0)) {
          all[date] = fromCloudRow(row);
          changed = true;
        }
      });
      if (changed) { lsSave(); render(); }
      setCloudStatus('ok');
    })
    .catch(function (e) { console.warn('云端拉取失败', e); setCloudStatus('err'); });
}

function syncPushDay(date) {
  var d = all[date];
  if (!d || !cloudReady) return Promise.resolve(false);
  if (!d.dirty) return Promise.resolve(true);
  setCloudStatus('busy');
  var payload = {
    date: date,
    data: toCloudData(d),
    updated_at: new Date().toISOString()
  };
  return sbFetch('', {
    method: 'POST',
    body: JSON.stringify([payload]),
    prefer: 'resolution=merge-duplicates'
  })
    .then(function () {
      d.dirty = false;
      d.updatedAt = Date.now();
      lsSave();
      setCloudStatus('ok');
      return true;
    })
    .catch(function (e) { console.warn('云端推送失败', date, e); setCloudStatus('err'); return false; });
}

function flushDirtyLocal() {
  if (!cloudReady) return;
  Object.keys(all).forEach(function (date) {
    if (all[date] && all[date].dirty) syncPushDay(date);
  });
}

window._refreshCloud = function () {
  if (!cloudReady) { showToast('未配置云端，当前为本地模式'); return; }
  syncPullAll().then(function () { flushDirtyLocal(); });
};

/* ================= AI 反馈 ================= */
var AI_SYSTEM = '你是一位既懂教学、又懂高考的"学习教练"，也是 ta 亲近的学习伙伴。语气自然、温暖、口语化，用"你"称呼 ta，不评判、不打分、不摆老师架子。\n\n对方是一名中国高中生，在打卡页写下了今天各科"学到了什么"（可能是数学、物理、化学、生物、语文、英语中的若干科）。请像靠谱的朋友一样读一读，再完成下面的任务。\n\n【三条铁律】\n1. 术语规范：严格使用高中教材标准术语。数学里向量的"数量积"（也叫内积），不要用"点积"这种口语/英文直译；"叉乘/向量积/叉积"是大学内容、不在高中考纲，除非明确标注"大学拓展"否则不要提。物理、化学、生物同理，用教材原话。\n2. 考纲对齐：以高中课标和高考要求为准。可适度拓展，但必须：(a) 明确标注"拓展/大学视角"；(b) 紧扣 ta 正在学的知识，不跑偏到无关领域；(c) 优先讲清"这个知识点在高考里怎么考、怎么用、有哪些易错点"。\n3. 重方法胜过重答案：帮 ta 提炼背后的思维方法，而不是只给结论。\n\n【分科策略：先判断每科属于理科还是文科，套用对应重点】\n\n理科（数学、物理、化学、生物）：\n· 纠错重点：概念是否精确、推理/计算/符号是否出错、术语是否规范；\n· 思想方法（拓展时从中提炼）：\n  数学——函数与方程、数形结合、分类讨论、转化与化归、整体代换、特殊与一般；\n  物理——建模、守恒、图像分析、控制变量、微元/极限；\n  化学——守恒（质量/电荷/电子）、平衡、结构决定性质、分类比较；\n  生物——结构与功能相适应、稳态与反馈调节、实验对照与变量控制；\n· 拓展方向：从具体知识点提炼"可迁移的思想方法"，一句话点破"以后遇到什么情况还能用"；\n· 提问侧重：元认知（你当时是怎么想的？卡在哪一步？）+ 迁移（换个条件/情境还成立吗？）。\n\n文科（语文、英语）：\n· 纠错重点：理解是否准确（主旨/细节/情感理解偏差）、表达是否清晰（逻辑通不通、用词准不准）、是否言之有据；\n· 思维重点（拓展时从中提炼）：\n  语文——信息整合与概括、论证结构（论点-论据-论证）、批判性思维（多角度、有理有据）、审美鉴赏（意象/手法/情感）、写作立意与结构；\n  英语——语篇理解（主旨/推断/观点态度）、上下文逻辑连贯、跨文化视角、表达准确连贯得体；\n· 拓展方向：从阅读/写作提炼"怎么读得准、怎么写得好"的策略；\n· 提问侧重：理解类（作者为什么这么写/说？言外之意是什么？）+ 表达类（如果是你，会怎么立意/表达？）。\n\n【任务：按顺序完成（今天涉及的每科都要覆盖到）】\n\n一、回顾（summary）：\n用 2-3 句自然的话，复述 ta 今天学到的核心内容（证明你读懂了），再真诚地、具体地肯定 ta 做得好的地方（不要空泛的"很棒"）。\n\n二、纠错（corrections）：\n如果有错，友善指出，并先判断错误类型，再对症解释：\n- 概念性错误（理解偏了）→ 用大白话 + 生活比喻重新讲清楚；\n- 程序性错误（步骤、计算、符号错了）→ 指出具体哪一步、为什么错；\n- 表述不规范（术语或符号用错）→ 给出标准说法。\n用大白话，别堆术语。如果没错，corrections 留空数组。\n\n三、拓展（insights）：\n按上面的【分科策略】，从 ta 今天学的内容里提炼 1-2 个"元思维/元模型"（或文科的"阅读/写作策略"），并用一句话点破"以后遇到什么情况还能用"。尽量建立"触类旁通"的真实联系（例如向量的数量积 ↔ 物理里的功 W=F·s·cosθ），不要生拉硬拽。控制在 100 字左右。\n\n四、思考题（questions）：\n给 ta 2-3 个能引导 ta 自己思考的问题，按【分科策略】选类型（理科：元认知+迁移；文科：理解+表达）。每个问题配一个简短的参考答案，但所有问题放前面，所有参考答案放最后。\n\n【输出格式】\n只输出 JSON，不要输出任何其他内容：\n{"summary":"...","corrections":["..."],"insights":"...","questions":[{"q":"...","a":"..."}]}\ncorrections 没有就留空数组。全部用简体中文。';

function buildUserPrompt(date) {
  var d = dayGet(date);
  return d.tasks.filter(function (t) { return t.completed && t.note; })
    .map(function (t) { return '【' + t.name + '】' + t.note; }).join('\n');
}

function callAI(date) {
  var d = dayGet(date);
  var ctrl = new AbortController();
  var timer = setTimeout(function () { ctrl.abort(); }, 90000);
  return fetch(DEEPSEEK_URL, {
    method: 'POST', signal: ctrl.signal,
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: DEEPSEEK_MODEL,
      messages: [{ role: 'system', content: AI_SYSTEM }, { role: 'user', content: buildUserPrompt(date) }],
      max_tokens: 2500, temperature: 0.7, stream: false
    })
  }).then(function (resp) {
    if (!resp.ok) { return resp.text().then(function () { throw new Error('AI 服务暂时不可用（' + resp.status + '）'); }); }
    return resp.json();
  }).then(function (j) {
    var content = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '';
    var data = null;
    try { data = JSON.parse(content); }
    catch (e) {
      var m = content.match(/\{[\s\S]*\}/);
      if (m) { try { data = JSON.parse(m[0]); } catch (e2) { data = null; } }
    }
    if (!data || typeof data !== 'object') {
      d.analysis = { summary: content || '（AI 没读懂，可重新生成）', corrections: [], insights: '', questions: [], createdAt: new Date().toISOString() };
    } else {
      d.analysis = {
        summary: typeof data.summary === 'string' ? data.summary : '',
        corrections: Array.isArray(data.corrections) ? data.corrections.filter(function (c) { return typeof c === 'string'; }) : [],
        insights: typeof data.insights === 'string' ? data.insights : '',
        questions: Array.isArray(data.questions) ? data.questions.filter(function (q) { return q && typeof q === 'object'; }).map(function (q) { return { q: typeof q.q === 'string' ? q.q : '', a: typeof q.a === 'string' ? q.a : '' }; }) : [],
        createdAt: new Date().toISOString()
      };
    }
    d.aiError = null;
    lsSave();
    markDirtyAndSync(date);
  }).catch(function (err) {
    d.aiError = String(err && err.message ? err.message : err);
    lsSave();
    markDirtyAndSync(date);
  });
}

/* 追问场景的 system prompt：一对一答疑，口语化、大白话 */
var FOLLOWUP_SYSTEM = '你是一位既懂教学、又懂高考的"学习教练"，正在和一个高中生进行一对一答疑。语气自然、温暖、口语化，用"你"称呼 ta，不评判、不打分。\n\n背景：ta 刚才打卡写下了今天各科"学到了什么"，你已经给过一次反馈（回顾、纠错、拓展、思考题）。现在 ta 针对反馈里的某个点有困惑，来追问你。\n\n请针对 ta 的困惑，用大白话、结合生活例子，把这个问题讲清楚。术语用高中教材的标准说法。回答要简洁、直接、好懂，一般 2-4 句话，别长篇大论。如果 ta 问"为什么""怎么回事"，就从原理/直觉讲；如果问"怎么用""怎么做"，就给方法/步骤。\n\n只输出你的回答正文，不要任何前缀、不要 JSON。';

/* 追问：带完整上下文（笔记 + 原反馈 + 追问历史 + 新问题）调 AI */
function callFollowup(date, question) {
  var d = dayGet(date);
  var ctrl = new AbortController();
  var timer = setTimeout(function () { ctrl.abort(); }, 60000);

  var msgs = [
    { role: 'system', content: FOLLOWUP_SYSTEM },
    { role: 'user', content: '我今天打卡的笔记：\n' + buildUserPrompt(date) },
    { role: 'assistant', content: '我之前给你的反馈：\n' + (d.analysis ? (d.analysis.summary || '') : '') }
  ];
  var followups = (d.analysis && d.analysis.followups) || [];
  followups.forEach(function (f) {
    msgs.push({ role: 'user', content: f.q });
    msgs.push({ role: 'assistant', content: f.a });
  });
  msgs.push({ role: 'user', content: question });

  return fetch(DEEPSEEK_URL, {
    method: 'POST', signal: ctrl.signal,
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ model: DEEPSEEK_MODEL, messages: msgs, max_tokens: 800, temperature: 0.7, stream: false })
  }).then(function (resp) {
    if (!resp.ok) { return resp.text().then(function () { throw new Error('AI 服务暂时不可用（' + resp.status + '）'); }); }
    return resp.json();
  }).then(function (j) {
    return (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '';
  });
}

window._askFollowup = function () {

/* 每完成一科就分析：只要有已完成的笔记即触发；分析进行中又来新笔记则标记待补，跑完自动再跑一次 */
function maybeAnalyze(date, force) {
  var d = dayGet(date);
  var cnt = completedCount(date);
  if (cnt < 1 || !d.tasks.some(function (t) { return t.note; })) return;
  if (d.analyzing) { d.pendingAnalyze = true; lsSave(); return; }
  if (!force && (d.analysis || d.aiError)) { renderAI(); return; }
  d.analyzing = true; d.aiError = null; d.pendingAnalyze = false; lsSave();
  renderAI();
  callAI(date).then(function () {
    d.analyzing = false; lsSave();
    renderAI();
    pushAnalysisIfNeeded(date);
    if (d.pendingAnalyze) { d.pendingAnalyze = false; lsSave(); maybeAnalyze(date, true); }
  }).catch(function (e) {
    /* 兜底：任何异常都不能让 analyzing 卡死 */
    d.analyzing = false;
    if (!d.aiError) d.aiError = String(e && e.message ? e.message : e);
    lsSave();
    renderAI();
  });
}

function renderAI() {
  var panel = document.getElementById('aiPanel');
  if (!panel) return;
  var d = dayGet(curDate);
  var cnt = completedCount(curDate);
  var h = '';

  if (d.analyzing) {
    h += '<div class="ai-loading"><div class="spinner"></div><div style="margin-top:8px">正在读你的笔记，稍等几秒…</div></div>';
  } else if (d.analysis) {

/* ================= flomo 同步 ================= */
function pushFlomo(content) {
  if (!FLOMO_URL) return Promise.resolve(false);
  return fetch(FLOMO_URL, {
    method: 'POST', mode: 'cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ content: content })
  }).then(function (r) { return r.json(); }).then(function (j) {
    if (j && j.code !== undefined && j.code !== 0) { console.warn('flomo 推送失败', j); return false; }
    return true;
  }).catch(function (e) { console.warn('flomo 推送失败', e); return false; });
}

/* pushed.notes 存笔记内容：内容变了会重推；内容相同不重复推（含跨设备共享推送状态） */
function pushNoteIfNeeded(date, idx) {
  var d = dayGet(date), t = d.tasks[idx];
  if (!t || !t.completed || !t.note) return;
  var pushedVal = d.pushed.notes ? d.pushed.notes[idx] : undefined;
  if (pushedVal === t.note) return;   // 已推过且内容一致
  if (pushedVal === true) return;     // 旧格式：已推过（迁移时已转为内容）
  pushFlomo('📚 ' + fmtDate(date) + ' ' + t.name + '打卡：' + t.note + '\n' + FLOMO_TAG + '#' + t.name).then(function (ok) {
    if (ok) { d.pushed.notes[idx] = t.note; lsSave(); markDirtyAndSync(date); }
  });
}

function pushAnalysisIfNeeded(date) {
  var d = dayGet(date);
  if (!d.analysis || d.pushed.analysis) return;
  var a = d.analysis;
  var content = '🤖 ' + fmtDate(date) + ' AI 学习反馈\n📌 ' + a.summary;
  if (a.corrections && a.corrections.length) content += '\n❌ 纠正：' + a.corrections.slice(0, 2).join('；');
  if (a.insights) content += '\n🧠 知识联系：' + a.insights.slice(0, 80) + (a.insights.length > 80 ? '…' : '');
  if (a.questions && a.questions.length) content += '\n💡 想想：' + a.questions.slice(0, 2).map(function (q) { return q.q; }).join('；');
  content += '\n' + FLOMO_TAG + '#AI反馈';
  pushFlomo(content).then(function (ok) {
    if (ok) { d.pushed.analysis = true; lsSave(); markDirtyAndSync(date); }
  });
}

/* 标记某天有改动：本地已保存，异步推云端 */
function markDirtyAndSync(date) {
  var d = all[date];
  if (!d) return;
  d.dirty = true;
  lsSave();
  syncPushDay(date);
}

/* ================= 打卡弹窗 ================= */
var modalIdx = -1;

window._openNote = function (idx) {
  var d = dayGet(curDate), t = d.tasks[idx];
  if (!t) return;
  modalIdx = idx;
  document.getElementById('modalTitle').innerHTML = icon('book') + (t.completed ? '编辑 · ' : '') + t.name + ' · 你学到了什么？';
  var ta = document.getElementById('modalInput');
  ta.value = t.note || '';
  document.getElementById('modalSaveBtn').disabled = false;
  document.getElementById('noteModal').style.display = 'flex';
  setTimeout(function () { ta.focus(); }, 120);
};

/* 取消：只关弹窗，绝不改动任何打卡状态 */
window._cancelNote = function () {
  var idx = modalIdx;
  document.getElementById('noteModal').style.display = 'none';
  modalIdx = -1;
  if (idx >= 0) render();
};

window._saveNote = function () {
  if (modalIdx < 0) return;                 // 防御：没有打开的任务则不操作
  var d = dayGet(curDate), t = d.tasks[modalIdx];
  if (!t) { modalIdx = -1; return; }
  var v = document.getElementById('modalInput').value.trim();
  if (!v) {
    showToast('写点什么再保存哦，一句话也行');
    var ta = document.getElementById('modalInput');
    ta.style.borderColor = '#f87171';
    setTimeout(function () { ta.style.borderColor = ''; }, 1200);
    return;
  }
  var btn = document.getElementById('modalSaveBtn');
  btn.disabled = true;                       // 防重复提交
  var changed = !t.completed || t.note !== v;
  t.completed = true;
  t.note = v;
  if (changed) {
    d.analysis = null; d.aiError = null;     // 笔记变了，旧反馈作废，重新生成
    d.pushed.analysis = false;
  }
  lsSave();
  document.getElementById('noteModal').style.display = 'none';
  modalIdx = -1;
  render();
  markDirtyAndSync(curDate);
  pushNoteIfNeeded(curDate, t.task_index);
  if (changed) {
    var cnt = completedCount(curDate);
    showToast(cnt >= PASS_THRESHOLD ? '达标！正在同步…' : '已打卡！正在同步…');
    maybeAnalyze(curDate, false);
  }
};

/* ================= 其他操作 ================= */
window._copyToday = function () {
  var d = dayGet(curDate);
  var lines = ['📚 ' + fmtDate(curDate) + ' 学习打卡'];
  d.tasks.forEach(function (t) {
    if (t.completed) lines.push('✅ ' + t.name + '：' + (t.note || '（未写）'));
    else lines.push('⬜ ' + t.name);
  });
  if (d.analysis && d.analysis.summary) {
    lines.push('');
    lines.push('🤖 AI 反馈：' + d.analysis.summary);
  }
  copyText(lines.join('\n'));
};

window._refreshAI = function () {
  if (!DEEPSEEK_URL) { showToast('未配置 AI 服务'); return; }
  var d = dayGet(curDate);
  if (completedCount(curDate) < 1 || !d.tasks.some(function (t) { return t.note; })) {
    showToast('写下一科笔记后才能生成反馈哦');
    return;
  }
  d.analysis = null; d.aiError = null; d.pushed.analysis = false; lsSave();
  maybeAnalyze(curDate, true);
};

function copyText(text) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(function () { showToast('已复制！'); }, function () { showToast('已复制！'); });
  } else {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); showToast('已复制！'); } catch (e) {}
    document.body.removeChild(ta);
  }
}

  var d = all[date];

function isDayReviewed(date) {
  var d = all[date];
  if (!d || !d.review) return false;
  var done = d.tasks.filter(function (t) { return t.completed; });
  if (done.length === 0) return false;
  for (var i = 0; i < done.length; i++) if (!d.review[done[i].task_index]) return false;

}

  markDirtyAndSync(date);
  render();
};

  var d = all[date];
  if (!d) return;
  var done = d.tasks.filter(function (t) { return t.completed; });
  if (!d.review) d.review = {};
  var allRev = isDayReviewed(date);
  done.forEach(function (t) {

  h += '</div>';
  h += '<div class="selector-row"><label>URL</label><input type="text" id="cfgUrl" value="' + escapeHtml(curCfg.url || '') + '" placeholder="https://xxxx.supabase.co" autocomplete="off"></div>';
  h += '<div class="selector-row"><label>Key</label><input type="text" id="cfgKey" value="' + escapeHtml(curCfg.key || '') + '" placeholder="sb_publishable_..." style="font-size:13px" autocomplete="off"></div>';
  h += '<div class="btn-group"><button class="btn btn-primary" onclick="window._saveCloudCfg()">保存并连接</button>';
  h += '<button class="btn btn-outline" onclick="window._clearCloudCfg()">清除配置</button></div>';
  h += '</div></div>';

  h += '</div>';   /* end admin-full */

  app.innerHTML = h;
  renderCloudStatus();
  updateCloudKpi();
}

/* 同步顶部 KPI 云端状态卡片 */
function updateCloudKpi() {
  var statusEl = document.getElementById('cloudKpiStatus');
  var iconEl = document.getElementById('cloudKpiIcon');
  if (!statusEl) return;
  if (cloudStatus === 'ok') { statusEl.textContent = '✓ 已同步'; if (iconEl) iconEl.innerHTML = icon('cloud'); }
  else if (cloudStatus === 'busy') { statusEl.textContent = '同步中…'; if (iconEl) iconEl.innerHTML = icon('refresh'); }
  else if (cloudStatus === 'err') { statusEl.textContent = '⚠️ 失败'; if (iconEl) iconEl.innerHTML = icon('cloud-off'); }
  else { statusEl.textContent = '本地模式'; if (iconEl) iconEl.innerHTML = icon('cloud-off'); }
}

window._onDate = function () {
  var v = document.getElementById('dp').value;
  if (v) { curDate = v.replace(/-/g, ''); render(); }
};
window._copyLink = function () { copyText(studentLink()); };
window._exportData = function () {
  var blob = new Blob([JSON.stringify(all, null, 2)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'study_records_' + todayStr() + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('已导出 JSON 记录');
};
window._saveCloudCfg = function () {
  var url = document.getElementById('cfgUrl').value.trim();
  var key = document.getElementById('cfgKey').value.trim();
  if (!url || !key) { showToast('请把 URL 和 Key 都填上'); return; }
  setStore(CFG_URL_KEY, url);
  setStore(CFG_KEY_KEY, key);
  showToast('已保存，正在连接云端…');
  location.reload();
};
window._clearCloudCfg = function () {
  try { localStorage.removeItem(CFG_URL_KEY); localStorage.removeItem(CFG_KEY_KEY); } catch (e) {}
  location.reload();
};

/* ================= 启动 ================= */
(function init() {
  loadAll();
  var p = new URLSearchParams(window.location.search);
  var d = p.get('d'), m = p.get('m');
  viewMode = p.has('s') ? 'student' : 'admin';
  if (d && d.length === 8 && /^\d{8}$/.test(d)) curDate = d;
  curMode = (m && MODES[m]) ? m : defaultMode(curDate);
  dayGet(curDate);

  // 弹窗按钮事件绑定（静态 HTML，只需绑一次）
  var saveBtn = document.getElementById('modalSaveBtn');
  var cancelBtn = document.getElementById('modalCancelBtn');
  if (saveBtn) saveBtn.addEventListener('click', window._saveNote);
  if (cancelBtn) cancelBtn.addEventListener('click', window._cancelNote);

  render();

  // 跨天自动切日期
  setInterval(function () {
    var t = todayStr();
    if (t !== curDate) { curDate = t; dayGet(curDate); render(); flushDirtyLocal(); }
  }, 60000);

  // 每次打开：补推未同步的打卡，并自动触发 AI 分析
  var day = dayGet(curDate);
  day.tasks.forEach(function (t, i) { pushNoteIfNeeded(curDate, i); });
  if (DEEPSEEK_URL) maybeAnalyze(curDate, false);

  // 云端初始化（可选，REST 直连无需外部 SDK）
  var cfg = getCloudCfg();
  if (!cfg.url || !cfg.key) {
    setCloudStatus('off');
  } else {
    cloudReady = true;
    syncPullAll().then(function () {
      flushDirtyLocal();
    });
  }
})();
</script>
